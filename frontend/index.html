<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ layout_direction }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fa" />
    <link
      rel="icon"
      href="/assets/frappe_books/books-icon.png"
      type="image/png"
    />
    <title>Frappe Books | {{ app_name }}</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.csrf_token = '{{ csrf_token }}';
      window.frappe = window.frappe || {};
      frappe.csrf_token = window.csrf_token;
      frappe.boot = {{ frappe.utils.orjson_dumps(boot, default=frappe.json_handler) }};
      frappe.boot.layout_direction = '{{ layout_direction }}';
    </script>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
